<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bivencas Ultimate</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f0f13;
            --card: #1a1a23;
            --accent: #3b82f6;
            --yellow: #ffdd00;
            --text: #ffffff;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        /* Навигация сверху */
        .page { display: none; padding: 15px; padding-bottom: 100px; animation: fadeIn 0.3s; }
        .active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Виджет баланса */
        .balance-card {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            padding: 25px; border-radius: 20px; text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        /* Игры - сетка */
        .games-list { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .game-card {
            background: var(--card); border-radius: 15px; padding: 20px;
            text-align: center; border: 1px solid #333;
        }
        .game-icon { font-size: 40px; display: block; margin-bottom: 10px; }

        /* Нижнее меню */
        .nav-bar {
            position: fixed; bottom: 0; width: 100%;
            background: #16161e; display: flex; justify-content: space-around;
            padding: 15px 0; border-top: 1px solid #333; z-index: 1000;
        }
        .nav-item { text-align: center; font-size: 10px; color: #777; transition: 0.3s; }
        .nav-item.active-nav { color: var(--accent); }
        .nav-item span { display: block; font-size: 24px; }

        /* Кнопки */
        .btn {
            background: var(--accent); color: white; border: none;
            padding: 12px 20px; border-radius: 10px; font-weight: bold; width: 100%;
        }
        .btn:disabled { background: #333; color: #666; }

        /* История */
        .hist-item {
            display: flex; justify-content: space-between;
            padding: 10px; border-bottom: 1px solid #333; font-size: 13px;
        }

        /* --- РУЛЕТКА --- */
        .roulette-container { position: relative; width: 260px; height: 260px; margin: 20px auto; }
        #wheel {
            width: 100%; height: 100%; border-radius: 50%;
            border: 8px solid #222; transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1);
            background: conic-gradient(
                #059669 0deg 9.7deg, #dc2626 9.7deg 19.4deg, #111 19.4deg 29.1deg,
                #dc2626 29.1deg 38.8deg, #111 38.8deg 48.5deg, #dc2626 48.5deg 58.2deg
            ); /* Тут упрощенный градиент для примера */
        }
        .pointer {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 15px solid transparent;
            border-right: 15px solid transparent; border-top: 25px solid white; z-index: 10;
        }

        /* --- МИНЫ --- */
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 20px 0; }
        .cell { aspect-ratio: 1; background: #2a2a35; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .cell.open-win { background: #059669; }
        .cell.open-lose { background: #dc2626; }
    </style>
</head>
<body>

    <!-- Вкладка: Баланс -->
    <div id="p-balance" class="page active">
        <div class="balance-card">
            <div style="font-size: 14px; opacity: 0.7;">Твой баланс</div>
            <div id="main-balance" style="font-size: 38px; font-weight: bold;">0 🪙</div>
        </div>
        
        <div class="game-card">
            <h3>🎁 Ежедневный бонус</h3>
            <p>+3,333 коинов каждые 4 часа</p>
            <button id="btn-bonus" class="btn" onclick="claimBonus()">Забрать бонус</button>
            <div id="bonus-timer" style="margin-top: 10px; color: var(--accent); font-weight: bold;"></div>
        </div>

        <h3 style="margin-top: 20px;">Последние 30 игр</h3>
        <div id="history-list" class="game-card" style="padding: 10px; text-align: left;"></div>
    </div>

    <!-- Вкладка: Игры -->
    <div id="p-games" class="page">
        <div class="games-list">
            <div class="game-card" onclick="openGame('mines')">
                <span class="game-icon">💣</span>МИНЫ
            </div>
            <div class="game-item game-card" onclick="openGame('roulette')">
                <span class="game-icon">🎡</span>РУЛЕТКА
            </div>
            <div class="game-card" onclick="openGame('dice')">
                <span class="game-icon">🎲</span>DICE (B7M)
            </div>
        </div>
    </div>

    <!-- Вкладка: Кланы -->
    <div id="p-clans" class="page">
        <h3>👥 Кланы</h3>
        <div class="game-card">
            <input type="text" id="clan-input" placeholder="Название клана" style="width: 80%; padding: 10px; border-radius: 5px; border: none; background: #111; color: white;">
            <button class="btn" style="margin-top: 10px;" onclick="createClan()">Создать клан</button>
        </div>
        <div id="clans-list" style="margin-top: 15px;"></div>
    </div>

    <!-- ИГРА: МИНЫ -->
    <div id="g-mines" class="page">
        <button onclick="switchPage('p-games')" style="background:none; color:white; border:none;">← Назад</button>
        <center>
            <h2 id="mines-mult">x1.00</h2>
            <div class="mines-grid" id="mines-board"></div>
            <button id="btn-mine-start" class="btn" onclick="startMines()">СТАРТ (100 🪙)</button>
            <button id="btn-mine-cash" class="btn" style="display:none; background:#059669;" onclick="cashoutMines()">ЗАБРАТЬ</button>
        </center>
    </div>

    <!-- Навигация -->
    <div class="nav-bar">
        <div class="nav-item active-nav" id="n-balance" onclick="switchPage('p-balance')"><span>💰</span>Баланс</div>
        <div class="nav-item" id="n-games" onclick="switchPage('p-games')"><span>🎮</span>Игры</div>
        <div class="nav-item" id="n-top" onclick="switchPage('p-balance')"><span>🏆</span>Топ</div>
        <div class="nav-item" id="n-clans" onclick="switchPage('p-clans')"><span>👥</span>Кланы</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Состояние игры (сохраняем в память телефона)
        let state = JSON.parse(localStorage.getItem('bivencas_v2')) || {
            balance: 5000,
            history: [],
            lastBonus: 0,
            clans: []
        };

        function save() {
            localStorage.setItem('bivencas_v2', JSON.stringify(state));
            document.getElementById('main-balance').innerText = state.balance.toLocaleString() + " 🪙";
            renderHistory();
        }

        function switchPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            tg.HapticFeedback.impactOccurred('light');
        }

        // --- БОНУС ---
        function claimBonus() {
            let now = Date.now();
            if (now - state.lastBonus < 4 * 3600000) return;
            state.balance += 3333;
            state.lastBonus = now;
            state.history.unshift({name: "Бонус", res: "+3333"});
            save();
        }

        setInterval(() => {
            let diff = 4 * 3600000 - (Date.now() - state.lastBonus);
            let btn = document.getElementById('btn-bonus');
            if (diff > 0) {
                btn.disabled = true;
                let h = Math.floor(diff/3600000);
                let m = Math.floor((diff%3600000)/60000);
                let s = Math.floor((diff%60000)/1000);
                document.getElementById('bonus-timer').innerText = `${h}ч ${m}м ${s}с`;
            } else {
                btn.disabled = false;
                document.getElementById('bonus-timer').innerText = "ГОТОВО!";
            }
        }, 1000);

        // --- МИНЫ ---
        let mines = { active: false, board: [], bet: 100, opened: 0 };
        function startMines() {
            if(state.balance < 100) return;
            state.balance -= 100;
            mines = { active: true, board: [], opened: 0 };
            while(mines.board.length < 5) {
                let r = Math.floor(Math.random()*25);
                if(!mines.board.includes(r)) mines.board.push(r);
            }
            document.getElementById('btn-mine-start').style.display = 'none';
            document.getElementById('btn-mine-cash').style.display = 'block';
            renderMines();
            save();
        }

        function renderMines() {
            let b = document.getElementById('mines-board');
            b.innerHTML = '';
            for(let i=0; i<25; i++) {
                let c = document.createElement('div');
                c.className = 'cell';
                c.onclick = () => {
                    if(!mines.active || c.innerText !== '') return;
                    if(mines.board.includes(i)) {
                        c.classList.add('open-lose'); c.innerText = '💣';
                        mines.active = false;
                        state.history.unshift({name:"Мины", res:"-100"});
                        setTimeout(() => switchPage('p-games'), 1500);
                    } else {
                        c.classList.add('open-win'); c.innerText = '💎';
                        mines.opened++;
                        document.getElementById('mines-mult').innerText = "x" + (1 + mines.opened*0.4).toFixed(2);
                        tg.HapticFeedback.impactOccurred('medium');
                    }
                };
                b.appendChild(c);
            }
        }

        function cashoutMines() {
            let win = Math.floor(100 * (1 + mines.opened*0.4));
            state.balance += win;
            state.history.unshift({name:"Мины", res:"+"+win});
            mines.active = false;
            switchPage('p-games');
            document.getElementById('btn-mine-start').style.display = 'block';
            document.getElementById('btn-mine-cash').style.display = 'none';
            save();
        }

        // --- ОБЩЕЕ ---
        function openGame(g) { switchPage('g-' + g); if(g === 'mines') {
            document.getElementById('btn-mine-start').style.display = 'block';
            document.getElementById('btn-mine-cash').style.display = 'none';
            renderMines();
        }}

        function renderHistory() {
            let l = document.getElementById('history-list');
            l.innerHTML = '';
            state.history.slice(0, 30).forEach(h => {
                l.innerHTML += `<div class="hist-item"><span>${h.name}</span><span style="color:${h.res[0]=='+'?'#059669':'#dc2626'}">${h.res}</span></div>`;
            });
        }

        function createClan() {
            let n = document.getElementById('clan-input').value;
            if(n.length > 2) { state.clans.push(n); save(); renderClans(); }
        }

        function renderClans() {
            let l = document.getElementById('clans-list');
            l.innerHTML = '';
            state.clans.forEach(c => l.innerHTML += `<div class="game-card" style="margin-bottom:10px;">🛡️ ${c}</div>`);
        }

        save(); renderClans();
    </script>
</body>
</html>
