<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Casino App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a1a; /* Черный фон */
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column; /* Элементы идут друг под другом */
            align-items: center; /* Центрирование по горизонтали */
            height: 100vh; /* Заполняет весь экран */
            justify-content: center; /* Центрирование по вертикали */
            box-sizing: border-box; /* Чтобы padding не вылезал за границы */
        }
        .balance-card {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            width: 90%; /* Чуть меньше ширины экрана */
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .balance-amount {
            font-size: 36px;
            font-weight: bold;
        }
        .btn-spin {
            background-color: #ffdd00; /* Желтый цвет кнопки */
            color: black;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer; /* Указатель мыши */
            width: 80%; /* Кнопка занимает 80% ширины */
            transition: transform 0.2s ease; /* Плавный эффект при нажатии */
        }
        .btn-spin:hover {
            transform: scale(1.05); /* Чуть увеличивается при наведении */
        }
        .btn-spin:active {
            transform: scale(1); /* Возвращается при нажатии */
        }
    </style>
</head>
<body>
    <div class="balance-card">
        <div style="font-size: 14px; opacity: 0.8;">Твой баланс</div>
        <div class="balance-amount">1000 💎</div>
    </div>

    <button class="btn-spin" onclick="alert('Крутим барабаны!')">🎰 КРУТИТЬ!</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран
        
        // Здесь будет код для связи с ботом (будет позже)
        // tg.ready(); // Опционально, чтобы сообщить Telegram, что приложение готово
    </script>
</body>
</html>
