<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dime App Clone</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #141414;
            --card: #222222;
            --accent: #3b82f6;
            --text: #ffffff;
            --gray: #888888;
            --red: #ef4444;
            --green: #22c55e;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0; user-select: none;
        }

        .page { display: none; padding: 15px; padding-bottom: 100px; }
        .active { display: block; }

        /* Элементы интерфейса */
        .card { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 15px; }
        .balance-box { background: linear-gradient(135deg, #4f46e5, #3b82f6); padding: 25px; border-radius: 20px; text-align: center; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px; }
        .btn:disabled { background: #444; color: #777; }

        /* Сетка игры МИНЫ */
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 15px 0; }
        .mine-cell { aspect-ratio: 1; background: #333; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .mine-cell.open { background: #444; }
        .mine-cell.win { background: var(--green); }
        .mine-cell.lose { background: var(--red); }

        /* История */
        .history-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #333; font-size: 14px; }

        /* Меню */
        .nav { position: fixed; bottom: 0; width: 100%; background: #1a1a1a; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; }
        .nav-item { text-align: center; font-size: 10px; color: var(--gray); }
        .nav-item.active { color: var(--accent); }
        .nav-item span { display: block; font-size: 22px; }

        /* Кости */
        .dice-box { display: flex; justify-content: center; gap: 20px; font-size: 50px; margin: 20px 0; }
        input[type="number"] { background: #111; border: 1px solid #444; color: white; padding: 10px; border-radius: 8px; width: 80%; }
    </style>
</head>
<body>

    <!-- ГЛАВНАЯ -->
    <div id="home" class="page active">
        <div class="balance-box">
            <div style="font-size: 12px; opacity: 0.8;">Ваш баланс</div>
            <div id="balance-val" style="font-size: 32px; font-weight: 800;">0 🪙</div>
        </div>
        
        <div class="card" style="margin-top: 15px;">
            <h3>Ежедневный бонус</h3>
            <p style="color: var(--gray); font-size: 14px;">+3,333 коинов каждые 4 часа</p>
            <button id="bonus-btn" class="btn" onclick="claimBonus()">Забрать бонус</button>
            <div id="bonus-timer" style="text-align: center; margin-top: 5px; font-size: 12px; color: var(--accent);"></div>
        </div>

        <h3>История игр (Топ 30)</h3>
        <div class="card" id="history-list">
            <!-- История -->
        </div>
    </div>

    <!-- ИГРЫ -->
    <div id="games" class="page">
        <div class="card" onclick="showGame('mines')">💣 Mines</div>
        <div class="card" onclick="showGame('dice')">🎲 7M (Dice)</div>
    </div>

    <!-- КЛАНЫ -->
    <div id="clans" class="page">
        <h3>Кланы</h3>
        <div class="card">
            <input type="text" id="clan-name" placeholder="Название клана" style="width: 90%; background: #111; border: 1px solid #444; color: white; padding: 10px; border-radius: 8px;">
            <button class="btn" onclick="createClan()">Создать свой клан</button>
        </div>
        <div id="clan-list"></div>
    </div>

    <!-- ИГРА: МИНЫ -->
    <div id="game-mines" class="page">
        <button onclick="switchPage('games')" style="background:none; border:none; color:var(--accent);">← Назад</button>
        <center>
            <h2 id="mine-multiplier">x1.00</h2>
            <div class="mines-grid" id="mines-board"></div>
            <input type="number" id="mine-bet" value="100">
            <p>Бомбы: <select id="mine-count"><option>3</option><option>5</option><option>10</option></select></p>
            <button id="mine-start" class="btn" onclick="startMines()">ИГРАТЬ</button>
            <button id="mine-cashout" class="btn" style="background:var(--green); display:none;" onclick="cashoutMines()">ЗАБРАТЬ</button>
        </center>
    </div>

    <!-- ИГРА: КОСТИ (7M) -->
    <div id="game-dice" class="page">
        <button onclick="switchPage('games')" style="background:none; border:none; color:var(--accent);">← Назад</button>
        <div class="dice-box"><span id="d1">🎲</span><span id="d2">🎲</span></div>
        <input type="number" id="dice-bet" value="100">
        <div style="display: flex; gap: 5px; margin-top: 10px;">
            <button class="btn" onclick="playDice('less')">< 7 (x2.3)</button>
            <button class="btn" style="background:var(--green)" onclick="playDice('equal')">7 (x5.8)</button>
            <button class="btn" onclick="playDice('more')">> 7 (x2.3)</button>
        </div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <div class="nav">
        <div class="nav-item active" id="n-home" onclick="switchPage('home')"><span>🏠</span>Дом</div>
        <div class="nav-item" id="n-games" onclick="switchPage('games')"><span>🎮</span>Игры</div>
        <div class="nav-item" id="n-clans" onclick="switchPage('clans')"><span>👥</span>Кланы</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // --- ДАННЫЕ (LocalStorage) ---
        let state = JSON.parse(localStorage.getItem('casino_state')) |
{
            balance: 5000,
            history: [],
            lastBonus: 0,
            clans: []
        };

        function save() {
            localStorage.setItem('casino_state', JSON.stringify(state));
            document.getElementById('balance-val').innerText = state.balance.toLocaleString() + " 🪙";
            renderHistory();
        }

        function addHistory(game, amount, win) {
            let res = win ? "+" + amount : "-" + amount;
            state.history.unshift({ game, res, time: new Date().toLocaleTimeString() });
            if (state.history.length > 30) state.history.pop();
            save();
        }

        // --- НАВИГАЦИЯ ---
        function switchPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(id === 'home') document.getElementById('n-home').classList.add('active');
            if(id === 'games') document.getElementById('n-games').classList.add('active');
            if(id === 'clans') document.getElementById('n-clans').classList.add('active');
        }

        // --- БОНУС 4 ЧАСА ---
        function claimBonus() {
            let now = Date.now();
            let cooldown = 4 * 60 * 60 * 1000;
            if (now - state.lastBonus < cooldown) return;

            state.balance += 3333;
            state.lastBonus = now;
            addHistory("Бонус", 3333, true);
            tg.HapticFeedback.notificationOccurred('success');
        }

        setInterval(() => {
            let now = Date.now();
            let cooldown = 4 * 60 * 60 * 1000;
            let btn = document.getElementById('bonus-btn');
            let timer = document.getElementById('bonus-timer');
            
            if (now - state.lastBonus < cooldown) {
                btn.disabled = true;
                let diff = cooldown - (now - state.lastBonus);
                let h = Math.floor(diff / 3600000);
                let m = Math.floor((diff % 3600000) / 60000);
                timer.innerText = `Доступно через ${h}ч ${m}м`;
            } else {
                btn.disabled = false;
                timer.innerText = "Бонус готов!";
            }
        }, 1000);

        // --- ИГРА МИНЫ ---
        let mineGame = { active: false, bombs: [], opened: 0, bet: 0, count: 0 };

        function startMines() {
            let bet = parseInt(document.getElementById('mine-bet').value);
            if (bet > state.balance || bet <= 0) return alert("Мало коинов!");
            
            state.balance -= bet;
            mineGame = { active: true, bombs: [], opened: 0, bet: bet, count: parseInt(document.getElementById('mine-count').value) };
            
            // Расставляем бомбы
            while(mineGame.bombs.length < mineGame.count) {
                let r = Math.floor(Math.random() * 25);
                if(!mineGame.bombs.includes(r)) mineGame.bombs.push(r);
            }

            renderMines();
            document.getElementById('mine-start').style.display = 'none';
            document.getElementById('mine-cashout').style.display = 'block';
            document.getElementById('mine-multiplier').innerText = "x1.00";
            save();
        }

        function renderMines() {
            let board = document.getElementById('mines-board');
            board.innerHTML = '';
            for(let i=0; i<25; i++) {
                let cell = document.createElement('div');
                cell.className = 'mine-cell';
                cell.onclick = () => clickMine(i);
                board.ap

            }
        }

        function clickMine(idx) {
            if(!mineGame.active) return;
            let cells = document.getElementsByClassName('mine-cell');
            if(cells[idx].classList.contains('open')) return;

            if(mineGame.bombs.includes(idx)) {
                // ВЗРЫВ
                mineGame.active = false;
                cells[idx].classList.add('lose');
                cells[idx].innerText = '💣';
                addHistory("Mines", mineGame.bet, false);
                setTimeout(() => { switchPage('games'); document.getElementById('mine-start').style.display = 'block'; document.getElementById('mine-cashout').style.display = 'none'; }, 2000);
            } else {
                mineGame.opened++;
                cells[idx].classList.add('win');
                cells[idx].innerText = '💎';
                let mult = 1 + (mineGame.opened * (mineGame.count / 10));
                document.getElementById('mine-multiplier').innerText = "x" + mult.toFixed(2);
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        function cashoutMines() {
            if(!mineGame.active || mineGame.opened === 0) return;
            let mult = 1 + (mineGame.opened * (mineGame.count / 10));
            let win = Math.floor(mineGame.bet * mult);
            state.balance += win;
            addHistory("Mines", win, true);
            mineGame.active = false;
            switchPage('games');
            document.getElementById('mine-start').style.display = 'block';
            document.getElementById('mine-cashout').style.display = 'none';
        }

        // --- ИГРА КОСТИ ---
        function playDice(type) {
            let bet = parseInt(document.getElementById('dice-bet').value);
            if(bet > state.balance || bet <= 0) return;

            state.balance -= bet;
            let d1 = Math.floor(Math.random() * 6) + 1;
            let d2 = Math.floor(Math.random() * 6) + 1;
            let sum = d1 + d2;
            
            document.getElementById('d1').innerText = d1;
            document.getElementById('d2').innerText = d2;

            let win = false;
            let mult = 0;

            if(type === 'less' && sum < 7) { win = true; mult = 2.3; }
            if(type === 'equal' && sum === 7) { win = true; mult = 5.8; }
            if(type === 'more' && sum > 7) { win = true; mult = 2.3; }

            if(win) {
                let winAmt = Math.floor(bet * mult);
                state.balance += winAmt;
                addHistory("Dice", winAmt, true);
                tg.HapticFeedback.notificationOccurred('success');
            } else {
                addHistory("Dice", bet, false);
            }
        }

        // --- КЛАНЫ ---
        function createClan() {
            let name = document.getElementById('clan-name').value;
            if(name.length < 3) return alert("Имя слишком короткое");
            state.clans.push(name);
            renderClans();
            save();
        }

        function renderClans() {
            let list = document.getElementById('clan-list');
            list.innerHTML = '';
            state.clans.forEach(c => {
                list.innerHTML += `<div class="card">🛡️ ${c}</div>`;
            });
        }

        function renderHistory() {
            let list = document.getElementById('history-list');
            list.innerHTML = '';
            state.history.forEach(h => {
                list.innerHTML += `<div class="history-item"><span>${h.game} (${h.time})</span><span style="color:${h.res.includes('+') ? 'var(--green)' : 'var(--red)'}">${h.res}</span></div>`;
            });
}

        function showGame(g) { switchPage('game-' + g); if(g === 'mines') renderMines(); }

        // Инициализация
        save();
        renderClans();
        renderHistory();
    </script>
</body>
</html>
