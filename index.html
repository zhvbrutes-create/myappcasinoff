<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bivencas Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        /* Карточка баланса */
        .balance-card {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            width: 90%;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        /* Барабаны слотов */
        .slots-container {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .slot {
            width: 80px;
            height: 100px;
            background: #2c2c2c;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border: 2px solid #444;
            transition: all 0.1s;
        }

        /* Кнопка */
        .btn-spin {
            background: #ffdd00;
            color: black;
            border: none;
            padding: 15px 50px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 22px;
            box-shadow: 0 5px 15px rgba(255, 221, 0, 0.4);
            cursor: pointer;
        }

        .btn-spin:disabled {
            background: #555;
            color: #888;
            box-shadow: none;
        }

        /* Анимация победы */
        .win-text {
            color: #ffdd00;
            font-weight: bold;
            height: 30px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="balance-card">
        <div style="font-size: 14px; opacity: 0.8;">Твой баланс</div>
        <div id="balance" style="font-size: 36px; font-weight: bold;">1000 💎</div>
    </div>

    <div id="status" class="win-text"></div>

    <div class="slots-container">
        <div id="slot1" class="slot">🎰</div>
        <div id="slot2" class="slot">🎰</div>
        <div id="slot3" class="slot">🎰</div>
    </div>

    <button id="spin-button" class="btn-spin" onclick="playGame()">КРУТИТЬ!</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 1000;
        const symbols = ["🍎", "🍋", "💎", "🍒", "7️⃣", "⭐️"];
        const bet = 100;

        function playGame() {
            if (balance < bet) {
                document.getElementById('status').innerText = "Недостаточно 💎!";
                return;
            }

            // Списываем ставку
            balance -= bet;
            updateUI();
            
            const btn = document.getElementById('spin-button');
            btn.disabled = true;
            document.getElementById('status').innerText = "Крутим...";

            // Имитация вращения (анимация)
            let spins = 0;
            let timer = setInterval(() => {
                document.getElementById('slot1').innerText = symbols[Math.floor(Math.random() * symbols.length)];
                document.getElementById('slot2').innerText = symbols[Math.floor(Math.random() * symbols.length)];
                document.getElementById('slot3').innerText = symbols[Math.floor(Math.random() * symbols.length)];
                spins++;

                if (spins > 15) {
                    clearInterval(timer);
                    finishGame();
                }
            }, 100);
        }

        function finishGame() {
            const btn = document.getElementById('spin-button');
            const s1 = symbols[Math.floor(Math.random() * symbols.length)];
            const s2 = symbols[Math.floor(Math.random() * symbols.length)];
            const s3 = symbols[Math.floor(Math.random() * symbols.length)];

            document.getElementById('slot1').innerText = s1;
            document.getElementById('slot2').innerText = s2;
            document.getElementById('slot3').innerText = s3;

            // Логика выигрыша
            if (s1 === s2 && s2 === s3) {
                let win = bet * 10;
                balance += win;
                document.getElementById('status').innerText = "ДЖЕКПОТ! +" + win;
                tg.HapticFeedback.notificationOccurred('success'); // Вибрация
            } else if (s1 === s2 || s2 === s3 || s1 === s3) {
                let win = bet * 2;
                balance += win;
                document.getElementById('status').innerText = "ПОБЕДА! +" + win;
                tg.HapticFeedback.impactOccurred('medium'); // Вибрация
            } else {
                document.getElementById('status').innerText = "Проигрыш 😢";
            }

            updateUI();
            btn.disabled = false;
        }

        function updateUI() {
            document.getElementById('balance').innerText = balance + " 💎";
        }
    </script>
</body>
</html>
