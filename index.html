<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bivencas Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #111111;
            --card-bg: #1e1e1e;
            --accent: #6a11cb;
            --text: #ffffff;
            --yellow: #ffdd00;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Навигация сверху */
        .header {
            padding: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            border-bottom: 1px solid #333;
        }

        /* Контейнеры страниц */
        .page {
            display: none;
            padding: 20px;
            padding-bottom: 100px; /* Чтобы меню не закрывало контент */
            animation: fadeIn 0.3s ease;
        }

        .active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Карточка баланса */
        .balance-card {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        /* Сетка игр */
        .games-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .game-item {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 1px solid #333;
        }

        .game-icon { font-size: 40px; margin-bottom: 10px; }

        /* Таблица Топа */
        .leaderboard {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
        }

        .leader-item {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid #333;
        }

        .leader-item:last-child { border: none; }
        /* Нижнее меню */
        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #181818;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #333;
            z-index: 100;
        }

        .nav-item {
            text-align: center;
            opacity: 0.5;
            font-size: 12px;
            cursor: pointer;
        }

        .nav-item.active-nav {
            opacity: 1;
            color: var(--yellow);
        }

        .nav-item span { display: block; font-size: 24px; }

        /* Кнопки */
        .btn {
            background: var(--yellow);
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 10px;
        }

        /* Мини-игра Рулетка */
        .roulette-wheel {
            width: 200px;
            height: 200px;
            border: 10px solid var(--yellow);
            border-radius: 50%;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            transition: transform 2s cubic-bezier(0.1, 0.7, 0.1, 1);
        }
    </style>
</head>
<body>

    <!-- ВКЛАДКА: ГЛАВНАЯ -->
    <div id="home" class="page active">
        <div class="balance-card">
            <div style="opacity: 0.8;">Мой Баланс</div>
            <div id="user-balance" style="font-size: 42px; font-weight: bold;">1500 💎</div>
        </div>
        <div style="margin-top: 20px;">
            <h3>Ежедневный бонус</h3>
            <div class="game-item">
                <div>Получите случайную сумму</div>
                <button class="btn" onclick="getBonus()">Забрать 🎁</button>
            </div>
        </div>
    </div>

    <!-- ВКЛАДКА: ИГРЫ -->
    <div id="games" class="page">
        <h3>Доступные игры</h3>
        <div class="games-grid">
            <div class="game-item" onclick="openRoulette()">
                <div class="game-icon">🎡</div>
                <div>Roulette</div>
            </div>
            <div class="game-item">
                <div class="game-icon">🎰</div>
                <div>Slots</div>
            </div>
            <div class="game-item">
                <div class="game-icon">💣</div>
                <div>Mines</div>
            </div>
            <div class="game-item">
                <div class="game-icon">🃏</div>
                <div>Blackjack</div>
            </div>
        </div>
    </div>

    <!-- ВКЛАДКА: ТОП -->
    <div id="top" class="page">
        <h3>Топ недели 🏆</h3>
        <div class="leaderboard">
            <div class="leader-item"><span>1. zhvbrutes</span> <span>999k 💎</span></div>
            <div class="leader-item"><span>2. Player_1337</span> <span>500k 💎</span></div>
            <div class="leader-item"><span>3. Bivencas_Fan</span> <span>250k 💎</span></div>
            <div class="leader-item"><span>4. Mike_Ross</span> <span>100k 💎</span></div>
        </div>
    </div>

    <!-- ОКНО ИГРЫ: РУЛЕТКА (Скрыто по умолчанию) -->
    <div id="roulette-screen" class="page">
        <button onclick="switchPage('games')" style="background: none; color: white; border: none;">← Назад</button>
        <center>
            <h2>Lightning Roulette</h2>
            <div id="wheel" class="roulette-wheel">?</div>
            <p>Ставка: 100 💎</p>
            <div style="margin-bottom: 20px;">
                <button class="btn" onclick="spinRoulette('red')">КРАСНОЕ (x2)</button>
                <button class="btn" onclick="spinRoulette('black')" style="background: #333; color: white;">ЧЕРНОЕ (x2)</button>
            </div>
        </center>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="nav-bar">
        <div class="nav-item active-nav" id="nav-home" onclick="switchPage('home')">
            <span>🏠</span>Главная
        </div>
        <div class="nav-item" id="nav-games" onclick="switchPage('games')">
            <span>🎮</span>Игры
        </div>
        <div class="nav-item" id="nav-top" onclick="switchPage('top')">
            <span>🏆</span>Топ
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        let balance = 1500;

        // Функция переключения вкладок
        function switchPage(pageId) {
            // Скрываем все страницы
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            // Показываем нужную
            document.getElementById(pageId).classList.add('active');

            // Управляем иконками в меню
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
            if(pageId === 'home') document.getElementById('nav-home').classList.add('active-nav');
            if(pageId === 'games' || pageId === 'roulette-screen') document.getElementById('nav-games').classList.add('active-nav');
            if(pageId === 'top') document.getElementById('nav-top').classList.add('active-nav');
            
            tg.HapticFeedback.impactOccurred('light');
        }

        function getBonus() {
            let bonus = Math.floor(Math.random() * 500);
            balance += bonus;
            updateBalance();
            alert("Вы получили бонус: " + bonus + " 💎");
        }

        function updateBalance() {
            document.getElementById('user-balance').innerText = balance + " 💎";
        }

        // Логика Рулетки
        function openRoulette() {
            switchPage('roulette-screen');
        }

        function spinRoulette(colorBet) {
            if (balance < 100) return alert("Мало 💎!");
            
            balance -= 100;
            updateBalance();

            const wheel = document.getElementById('wheel');
            const resultNum = Math.floor(Math.random() * 37);
            const resultColor = (resultNum % 2 === 0) ? 'black' : 'red';
            
            wheel.style.transform = "rotate(" + (3600 + resultNum * 10) + "deg)";
            wheel.innerText = "⏳";

            setTimeout(() => {
                wheel.innerText = resultNum;
                wheel.style.borderColor = (resultColor === 'red') ? '#ff4d4d' : '#333';

                if (colorBet === resultColor) {
                    balance += 200;
                    alert("ВЫИГРЫШ! Выпало " + resultNum + " (" + resultColor + ")");
                } else {
                    alert("ПРОИГРЫШ! Выпало " + resultNum + " (" + resultColor + ")");
                }
                updateBalance();
                wheel.style.transform = "rotate(0deg)";
            }, 2000);
        }
    </script>
</body>
</html>
